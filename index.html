<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="theme-color" content="#0b0d08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Forja">
<meta name="description" content="Forja: tu entrenador de gimnasio. Rutinas a medida, pesos automáticos y rachas.">
<title>Forja · Entrenador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<script src="vendor/chart.umd.min.js" defer></script>
<style>
/* Manrope (fuente variable 500-800, subconjunto latino), alojada en el proyecto. */
@font-face{font-family:Manrope;font-style:normal;font-weight:500 800;font-display:swap;src:url(assets/fonts/manrope-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0b0d08;--s1:#16190f;--s2:#1f2317;--s3:#2a2f20;--line:#2b3021;--text:#f4f6ee;--mute:#8d9480;
  --lime:#d4f564;--ink:#0b0d08;--live:#ff5a4e;--ok:#9be15d;--warn:#ffb547;
  --legs:#5cb8e6;--push:#f07ab4;--pull:#a88cf0;--core:#4fd1b0;
  --font:Manrope,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:500 14px/1.5 var(--font);min-height:100vh;
  background:radial-gradient(120% 55% at 50% 112%,#33440f 0%,#141a08 38%,transparent 70%) fixed,var(--bg)}
main{max-width:460px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 18px 170px}
h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--lime);color:var(--ink)}
input,select{caret-color:var(--lime);accent-color:var(--lime)}
.big,.score .val b,.glass b,.glass strong,.stat b,#timer .t,.wbox input,.set input,.day b{font-variant-numeric:tabular-nums}
.mute{color:var(--mute);font-size:12px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:17px}
.sec a,.sec button{background:none;border:0;color:var(--mute);font-size:12px;padding:0}
/* Cabecera */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s2);border:1px solid var(--line)}
.round svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.me{background:var(--lime);color:var(--ink);font-weight:800;border:0}
.logo{font:italic 800 26px/1 var(--font);letter-spacing:-.02em}
.logo i{color:var(--lime);font-style:italic}
/* Historias (días del plan) */
.stories{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;width:62px}
.story .ring{width:58px;height:58px;border-radius:50%;padding:4px;background:var(--mix,var(--s3));position:relative}
.story .ring:after{content:'';position:absolute;inset:2.5px;border-radius:50%;border:2px solid var(--bg)}
.story .ring span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--s2);font-weight:800;font-size:15px}
.story.next{color:var(--lime)}
.story.next .ring span{background:var(--lime);color:var(--ink)}
.story.done .ring span{color:var(--lime)}
.story small{font-size:10.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62px}
/* Tira semanal */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:10px 6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;border-radius:999px;font-size:10.5px;color:var(--mute)}
.day b{font-size:15px;color:var(--text)}
.day i{width:5px;height:5px;border-radius:50%;background:transparent}
.day.on i{background:var(--lime)}
.day.today{background:var(--lime);color:var(--ink)}
.day.today b{color:var(--ink)}
.day.today.on i{background:var(--ink)}
/* Tarjeta hero con foto */
.hero{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:4/3.4;background:var(--s1)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,8,0) 35%,rgba(11,13,8,.85) 100%)}
.hero .vs{position:absolute;top:14px;left:14px;z-index:1;background:rgba(11,13,8,.6);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700}
.glass{position:absolute;left:12px;right:12px;bottom:12px;z-index:1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:rgba(22,25,15,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 14px}
.glass .side{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute)}
.glass .side b{font-size:20px;color:var(--text);line-height:1}
.glass .mid{text-align:center}
.glass .mid small{display:block;font-size:10.5px;color:var(--mute)}
.glass .mid strong{display:block;font-size:26px;line-height:1.1}
.livedot{color:var(--live);font-size:10.5px;font-weight:700}
.mtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--g);background:color-mix(in oklab,var(--g) 14%,transparent);border-radius:999px;padding:2px 9px 2px 7px;white-space:nowrap}
.mtag:before,.dot:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--g);flex-shrink:0}
.dot{display:inline-flex;align-items:center;gap:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.lowv{color:var(--warn);font-weight:800}
.effort{margin-top:12px}
.seg.sm span{min-width:40px;padding:7px 10px;font-size:12px}
.pain{display:flex;gap:8px;align-items:center;font-size:12.5px;margin-top:10px;color:var(--mute);cursor:pointer}
.pain input{width:18px;height:18px;margin:0}
.readiness{display:flex;gap:14px;align-items:center}
.rscore{width:70px;height:70px;flex-shrink:0;border-radius:50%;display:grid;place-content:center;text-align:center;border:3px solid var(--rc,var(--lime))}
.rscore b{font-size:24px;line-height:1;color:var(--rc,var(--lime))}
.rscore small{font-size:9.5px;color:var(--mute)}
.rscore.media{--rc:var(--warn)}.rscore.baja{--rc:var(--live)}
.insight{display:flex;gap:12px;align-items:flex-start}
.insight .ik{width:34px;height:34px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in oklab,var(--ic) 18%,var(--s1));color:var(--ic)}
.insight .ik svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.insight.ok{--ic:var(--lime)}.insight.warn{--ic:var(--warn)}.insight.info{--ic:var(--legs)}
.insight p{margin:3px 0 0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macros div{background:var(--s2);border-radius:16px;padding:10px;text-align:center}
.macros b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.macros small{font-size:10.5px;color:var(--mute)}
.art{margin-top:8px}
.cues{margin:4px 0 0;padding-left:18px}
.cues li{margin:3px 0;font-size:12.5px}
.donetag{color:var(--lime);font-size:10.5px;font-weight:800}
.dur{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--mute);font-weight:700}
.dur svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2}
.livedot:before{content:'●';margin-right:4px}
/* Tarjeta lima (marcador) */
.limecard{background:var(--lime);color:var(--ink);border-radius:24px;padding:14px 16px 16px;margin-top:12px}
.limecard .top{display:flex;justify-content:space-between;font-size:12px;font-weight:700}
.pilldark{background:var(--ink);color:var(--lime);border-radius:999px;padding:3px 10px;font-size:11px}
.score{display:grid;grid-template-columns:auto 1fr auto;align-items:center;margin-top:10px}
.score .ball{width:52px;height:52px;border-radius:50%;background:var(--ink);color:var(--lime);display:grid;place-items:center}
.score .ball svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.score .cap{display:block;text-align:center;font-size:10px;font-weight:800;margin-top:4px}
.score .ball small{display:block;font-size:9px;color:var(--ink);text-align:center;margin-top:4px;font-weight:700}
.score .val{text-align:center}
.score .val b{font-size:40px;line-height:1;letter-spacing:-.02em}
.score .val small{display:block;font-size:11px;font-weight:700;opacity:.7}
.alert{border-radius:18px;padding:12px 14px;margin-top:12px;font-size:13px;border:1px solid}
.alert.ok{background:#1b2510;border-color:#3f5a17;color:var(--lime)}
.alert.warn{background:#2a200d;border-color:#5a4415;color:var(--warn)}
/* Tarjetas de ejercicio estilo marcador */
.card{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:14px;margin-bottom:12px}
.mcard .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.mcard .team{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.mcard .big{font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em}
.mcard .big small{font-size:12px;color:var(--mute);margin-left:3px;font-weight:700}
.mcard .center{text-align:center;font-size:11px;color:var(--mute);line-height:1.35}
.mcard .center b{display:block;color:var(--text);font-size:12px}
.mcard h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mcard h3 small{font-size:11px;color:var(--mute);font-weight:600;white-space:nowrap}
.wbox{display:flex;align-items:baseline;gap:4px}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.wbox input{min-width:2.2ch;max-width:6ch;background:transparent;border:0;border-bottom:1.5px dashed var(--s3);border-radius:0;padding:0;font:800 34px/1 var(--font);color:var(--text);letter-spacing:-.02em}
.wbox input:focus{outline:0;border-bottom-color:var(--lime)}
.right{text-align:right}
.sets{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.set{position:relative}
.set input{width:54px;height:54px;border-radius:50%;text-align:center;background:var(--s2);border:1.5px solid var(--line);color:var(--text);font:800 18px var(--font);padding:0}
.set input::placeholder{color:#59604b}
.set input:focus{outline:0;border-color:var(--lime)}
.set input.done{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.set input.low{border-color:var(--live);color:var(--live)}
.set span{position:absolute;top:-4px;right:-2px;background:var(--s3);color:var(--mute);font-size:9px;font-weight:800;border-radius:999px;padding:1px 5px}
details{margin-top:14px;background:var(--s2);border-radius:16px}
summary{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;font-size:12.5px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary .mini{width:30px;height:30px;border-radius:50%;background:var(--s3);display:grid;place-items:center;transition:transform .2s}
details[open] summary .mini{transform:rotate(90deg)}
summary .mini svg{width:14px;height:14px;fill:none;stroke:var(--text);stroke-width:2.2}
.tools{display:grid;gap:10px;padding:0 12px 12px;font-size:12.5px;color:#d2d7c6}
.tools b{color:var(--text)}
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.plate{display:inline-grid;place-items:center;border-radius:3px;font:800 9px var(--font);color:var(--ink)}
.bar{width:24px;height:6px;background:#9aa092;border-radius:2px}
select,input{font:600 16px var(--font);color:var(--text);background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
select:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.btn{display:block;width:100%;border:0;border-radius:999px;padding:16px;font:800 15px var(--font);background:var(--lime);color:var(--ink);margin-top:14px;text-align:center;transition:transform .1s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--s2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--live);border:1px solid #5a2220}
/* Chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;font-size:12.5px;font-weight:700;color:var(--text)}
.chip i{width:26px;height:26px;border-radius:50%;background:color-mix(in oklab,var(--g,var(--s3)) 24%,var(--s1));color:var(--g,var(--text));display:grid;place-items:center;font-style:normal;font-size:11px}
.chip.on{border-color:var(--lime);background:#20280f}
.chip.on i{background:var(--lime);color:var(--ink)}
.chip.plain{padding:7px 14px}
/* Formulario */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg input,.goal input{position:absolute;opacity:0;pointer-events:none}
.seg label,.goal label{cursor:pointer}
.seg span{display:block;min-width:46px;text-align:center;padding:9px 13px;border-radius:999px;background:var(--s2);border:1px solid var(--line);font-weight:700;font-size:13px}
.seg input:checked+span{background:var(--lime);color:var(--ink);border-color:var(--lime)}
.seg input:focus-visible+span,.goal input:focus-visible+div{outline:2px solid var(--lime);outline-offset:2px}
.goal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.goal div{height:100%;padding:12px;border-radius:18px;background:var(--s2);border:1.5px solid var(--line)}
.goal div b{display:block;font-size:14px}
.goal div small{color:var(--mute);font-size:11.5px;line-height:1.35;display:block;margin-top:2px}
.goal input:checked+div{background:var(--lime);border-color:var(--lime);color:var(--ink)}
.goal input:checked+div small{color:#3b4220}
.field{margin-top:16px}
.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
/* Bienvenida (landing). Forma: tarjetas 24px, botones píldora. */
main.wide{max-width:1120px}
.ohero{display:grid;gap:22px;align-items:center;padding-top:4px}
.ohero .logo{margin-bottom:18px}
.ohero h1{font-size:clamp(34px,6.4vw,64px);line-height:1.02;letter-spacing:-.03em;text-transform:uppercase;text-wrap:balance}
.ohero h1 span{color:var(--lime)}
.ohero .lead{color:#c9cfbb;font-size:16px;line-height:1.55;max-width:42ch;margin:16px 0 0}
.ohero .btn{width:auto;display:inline-block;padding:16px 30px;margin-top:22px}
.ohero figure{margin:0;border-radius:28px;overflow:hidden;background:var(--s1);aspect-ratio:1;order:-1}
.ohero figure img{width:100%;height:100%;object-fit:cover;display:block}
.bento{display:grid;gap:12px}
.cell{border-radius:24px;overflow:hidden;position:relative;background:var(--s1);border:1px solid var(--line);min-height:220px;display:flex;flex-direction:column}
.cell h3{font-size:19px;line-height:1.15}
.cell p{margin:6px 0 0;font-size:13.5px;line-height:1.5;color:#c9cfbb;max-width:38ch}
.cell .body{padding:18px}
.cell.photo{justify-content:flex-end;min-height:360px}
.cell.photo>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cell.photo:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,8,0) 30%,rgba(11,13,8,.92) 100%)}
.cell.photo .body{position:relative;z-index:1}
.cell.lime{background:var(--lime);border-color:var(--lime);color:var(--ink);justify-content:space-between}
.cell.lime p{color:#3b4220}
.cell.split>img{width:100%;height:220px;object-fit:cover;display:block}
.mini-sets{display:flex;gap:8px;padding:18px 18px 0}
.mini-sets span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--lime);font-weight:800;font-size:16px}
.mini-ready{display:flex;align-items:center;gap:12px;padding:18px 18px 0}
.reveal{transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1)}
.io .reveal:not(.in){opacity:0;transform:translateY(18px)}
.ohero .rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.ohero .rise:nth-child(2){animation-delay:.06s}.ohero .rise:nth-child(3){animation-delay:.12s}.ohero .rise:nth-child(4){animation-delay:.18s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.setup-wrap{max-width:560px}
@media (min-width:860px){.ohero .lead{font-size:18px}}
@media (min-width:860px){
  .ohero{grid-template-columns:1.05fr .95fr;gap:48px;min-height:min(88dvh,760px)}
  .ohero figure{order:0;aspect-ratio:4/4.4}
  .bento{grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:auto auto}
  .bento .c1{grid-row:span 2;min-height:520px}
  .bento .c3{grid-row:span 2}
  .bento .c3>img{height:300px}
}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none}}
/* Tablas, listas, gráficas */
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:800}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;white-space:nowrap}
td.m{color:var(--mute)}
.vol{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;min-width:70px}
.vol i{display:block;height:100%;background:var(--lime)}
ul{padding-left:18px;margin:6px 0}li{margin:7px 0;color:#d2d7c6;font-size:13px}
.chart{position:relative;height:210px;margin-top:8px}
.nochart{display:grid;place-items:center;height:100%;color:var(--mute);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat small{font-size:10.5px;color:var(--mute)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:8px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s2)}
.heat i.on{background:var(--lime)}
.heat i.today{outline:1.5px solid var(--text);outline-offset:-1.5px}
.heat i.fut{opacity:.3}
.res{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res .ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-weight:800}
.res.up .ic{background:var(--lime);color:var(--ink)}.res.hold .ic{background:var(--s3);color:var(--warn)}.res.down .ic{background:#3a1715;color:var(--live)}
.prb{display:inline-block;margin-left:6px;background:var(--lime);color:var(--ink);font-size:10px;font-weight:800;padding:2px 8px;border-radius:999px;vertical-align:1px;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Barra flotante */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;padding:6px;border-radius:999px;
  background:rgba(31,35,23,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.08);z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.5)}
nav button{width:50px;height:50px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
nav button:active,.chip:active,.story:active,.seg span:active{transform:scale(.96)}
nav button.on{background:var(--lime);color:var(--ink)}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));width:min(424px,calc(100% - 36px));display:none;align-items:center;gap:10px;
  background:var(--s2);color:var(--text);border:1px solid var(--lime);border-radius:999px;padding:8px 8px 8px 18px;z-index:11;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#timer .t{font-size:22px;font-weight:800;min-width:62px;color:var(--lime)}
#timer .bar2{flex:1;height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
#timer .bar2 i{display:block;height:100%;background:var(--lime);transition:width .5s linear}
#timer button{background:var(--s3);color:var(--text);border:0;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer" role="timer" aria-live="polite"><span class="t" id="tleft">0:00</span><span class="bar2"><i id="tbar"></i></span><button onclick="addTime(30)" aria-label="Añadir 30 segundos al descanso">+30 s</button><button onclick="stopTimer()" aria-label="Saltar el descanso">Saltar</button></div>
<nav id="nav" aria-label="Navegación"></nav>
<script src="engine.js"></script>
<script src="coach.js"></script>
<script>
const E = WT, C = COACH, KEY = 'wt.v1';
let S = load(), tab = 'hoy', anim = true, tInt, tEnd = 0, tTotal = 1, charts = [], perfId = null;

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
let saveWarned = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { if (!saveWarned) { saveWarned = true; alert('Tus cambios no se están guardando: el navegador bloquea el almacenamiento de este sitio. Sal del modo privado o permite el almacenamiento y vuelve a abrir Forja.'); } } }
const today = () => new Date().toLocaleDateString('sv'); // YYYY-MM-DD local
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const iso = (n) => new Date(n * 864e5).toISOString().slice(0, 10);
const svg = (p) => `<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const I = {
  hoy: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  rutina: '<path d="M6 5v14M18 5v14M3 8v8M21 8v8M6 12h12"/>',
  progreso: '<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',
  perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  arrow: '<path d="M7 17L17 7M8 7h9v9"/>',
  coach: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 21l1.9-5.4A8 8 0 1 1 21 12z"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/>',
  flame: '<path d="M12 2c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};
const TABS = [['hoy', 'Inicio'], ['rutina', 'Rutina'], ['coach', 'Coach'], ['progreso', 'Progreso'], ['perfil', 'Perfil']];
const GOAL_TXT = { fuerza: 'Mover más kilos: 3-5 reps pesadas', hipertrofia: 'Ganar músculo: 6-15 reps cerca del fallo', resistencia: 'Aguantar más: 12-25 reps', definicion: 'Perder grasa sin perder músculo', general: 'Salud y constancia' };
const DOW = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const abbr = (name) => name.split(' ').map((w) => w[0]).join('').slice(0, 2).toUpperCase();
const sessionDates = () => S.sessions.map((s) => s.date);
const segs = (name, arr, v, cls = '') => `<div class="seg ${cls}">${arr.map(([k, l]) => `<label><input type="radio" name="${name}" value="${k}" ${String(k) === String(v) ? 'checked' : ''}><span>${l}</span></label>`).join('')}</div>`;
const todayReadiness = () => { const c = (S.checkins || {})[today()]; return c ? C.readiness(c) : null; };
const curSession = () => C.adjustSession(E.nextSession(S, today()), todayReadiness());
const GROUP = { 'Cuádriceps': 'legs', 'Glúteo': 'legs', 'Isquios': 'legs', 'Gemelos': 'legs', 'Cadena posterior': 'legs', 'Pecho': 'push', 'Hombro': 'push', 'Tríceps': 'push', 'Espalda': 'pull', 'Dorsal': 'pull', 'Bíceps': 'pull', 'Core': 'core' };
const GNAME = { legs: 'Pierna', push: 'Empuje', pull: 'Tirón', core: 'Core' };
const muscleGroup = (m) => GROUP[m.split('/')[0].split(' (')[0]] || 'core';
const grp = (id) => muscleGroup(E.EX[id][1]);
const gv = (g) => `--g:var(--${g})`;
const mtag = (id) => `<span class="mtag" style="${gv(grp(id))}">${E.EX[id][1]}</span>`;
const legend = () => `<div class="legend">${Object.entries(GNAME).map(([g, n]) => `<span class="mtag" style="${gv(g)}">${n}</span>`).join('')}</div>`;
// Anillo con la mezcla de grupos (por series) de un día del plan.
function mixRing(day) {
  const sets = { legs: 0, push: 0, pull: 0, core: 0 };
  day.exercises.forEach((e) => (sets[grp(e.id)] += e.sets));
  const tot = Object.values(sets).reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  return 'conic-gradient(' + Object.entries(sets).filter(([, n]) => n).map(([g, n]) => { const a = acc; acc += (n / tot) * 100; return `var(--${g}) ${a}% ${acc}%`; }).join(',') + ')';
}
const mixText = (day) => { const c = {}; day.exercises.forEach((e) => (c[GNAME[grp(e.id)]] = 1)); return Object.keys(c).join(', '); };

function render() {
  charts.forEach((c) => c.destroy()); charts = [];
  $('app').classList.toggle('wide', !S.profile);
  if (!S.profile) { $('nav').style.display = 'none'; $('app').innerHTML = onboarding(); revealOnScroll(); return; }
  $('nav').style.display = 'flex';
  $('nav').innerHTML = TABS.map(([k, l]) => `<button class="${tab === k ? 'on' : ''}" onclick="go('${k}')" aria-label="${l}" aria-current="${tab === k}">${svg(I[k])}</button>`).join('');
  $('app').innerHTML = `<div class="${anim ? 'fade' : ''}">${{ hoy, rutina, coach, progreso, perfil }[tab]()}</div>`; anim = false;
  drawCharts();
}
function go(k) { tab = k; anim = true; render(); scrollTo(0, 0); }
const header = (title) => `<div class="head"><button class="round me" onclick="go('perfil')" aria-label="Perfil">${svg(I.perfil)}</button>
  ${title ? `<h1 style="font-size:18px;text-transform:uppercase;letter-spacing:.04em">${title}</h1>` : '<div class="logo">FORJA<i>+</i></div>'}
  <button class="round" onclick="go('${tab === 'progreso' ? 'hoy' : 'progreso'}')" aria-label="${tab === 'progreso' ? 'Ir a Inicio' : 'Ir a Progreso'}">${svg(tab === 'progreso' ? I.hoy : I.progreso)}</button></div>`;
const sec = (t, link = '') => `<div class="sec"><h2>${t}</h2>${link}</div>`;

/* ---------- Gráficas ---------- */
function drawCharts() {
  const cvs = document.querySelectorAll('canvas[data-chart]');
  if (!cvs.length) return;
  if (!window.Chart) { cvs.forEach((c) => (c.parentNode.innerHTML = '<div class="nochart">Gráfica no disponible sin conexión</div>')); return; }
  cvs.forEach((cv) => {
    const d = JSON.parse(cv.dataset.chart), ctx = cv.getContext('2d'), g = ctx.createLinearGradient(0, 0, 0, 210);
    g.addColorStop(0, 'rgba(212,245,100,.35)'); g.addColorStop(1, 'rgba(212,245,100,0)');
    charts.push(new Chart(cv, {
      type: 'line',
      data: { labels: d.labels, datasets: [{ data: d.data, fill: true, tension: 0.4, borderWidth: 2.5, borderColor: '#d4f564', backgroundColor: g,
        pointBackgroundColor: '#d4f564', pointBorderColor: '#0b0d08', pointBorderWidth: 2, pointRadius: 4, pointHoverRadius: 6 }] },
      options: { maintainAspectRatio: false, animation: { duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 600 },
        plugins: { legend: { display: false }, tooltip: { backgroundColor: '#d4f564', titleColor: '#0b0d08', bodyColor: '#0b0d08', displayColors: false, padding: 10, callbacks: { label: (c) => `${c.parsed.y} ${d.unit || 'kg (máximo estimado)'}` } } },
        scales: { y: { grid: { color: 'rgba(255,255,255,.05)' }, border: { display: false }, ticks: { color: '#8d9480', padding: 8, precision: 0 } },
          x: { grid: { display: false }, border: { display: false }, ticks: { color: '#8d9480', maxRotation: 0, autoSkip: true } } } },
    }));
  });
}
addEventListener('load', () => S.profile && drawCharts()); // Chart.js carga con defer

/* ---------- Onboarding / perfil ---------- */
function onboarding() {
  return `<section class="ohero">
    <div><div class="logo rise">FORJA<i>+</i></div>
      <h1 class="rise">Tu entrenador, <span>en el bolsillo</span></h1>
      <p class="lead rise">Armo tu rutina según tu objetivo, tus días y tu tiempo, y subo el peso cuando estás listo.</p>
      <button class="btn rise" onclick="$('setup').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'})">Crear mi rutina</button></div>
    <figure><img src="assets/hero.jpg" alt="Mancuerna hexagonal negra iluminada en verde lima" width="900" height="900" fetchpriority="high"></figure>
  </section>
  ${sec('Qué hace Forja por ti')}
  <div class="bento">
    <article class="cell photo c1 reveal"><img src="assets/athlete.jpg" alt="Atleta haciendo sentadilla con barra en un gimnasio oscuro" loading="lazy" width="1100" height="828">
      <div class="body"><h3>Una rutina hecha a tu medida</h3><p>Fuerza, hipertrofia, resistencia o definición, ajustada a tus días y a los minutos que tienes.</p></div></article>
    <article class="cell lime c2 reveal"><div class="mini-sets" aria-hidden="true"><span>10</span><span>10</span><span>10</span></div>
      <div class="body"><h3>El peso sube cuando toca</h3><p>Completas todas las series en el tope del rango y la próxima sesión ya trae más carga.</p></div></article>
    <article class="cell split c3 reveal"><img src="assets/grip.jpg" alt="Manos con magnesio agarrando una barra" loading="lazy" width="678" height="900">
      <div class="body"><h3>Técnica en cada ejercicio</h3><p>Tres claves de ejecución y el error más común, siempre a mano mientras entrenas.</p></div></article>
    <article class="cell c4 reveal"><div class="mini-ready" aria-hidden="true"><div class="rscore media"><b>58</b><small>de 100</small></div><span class="mute">Dormiste 6 h</span></div>
      <div class="body"><h3>Un coach que lee tu día</h3><p>Con un check-in de 20 segundos, si llegas cansado la sesión se aligera sola.</p></div></article>
  </div>
  <div id="setup" class="setup-wrap" style="padding-top:12px">${iosHint()}${sec('Configura tu entrenador')}<div class="card">${profileForm({}, 'Crear mi rutina')}</div></div>`;
}
// iOS no muestra un botón de instalar: se explica cómo añadirla a la pantalla de inicio.
const isIOS = () => /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInstalled = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const iosHint = () => (isIOS() && !isInstalled() ? `<div class="card insight info"><span class="ik">${svg(I.info)}</span><div><b>Instálala en tu iPhone</b><p class="mute">En Safari, toca el botón Compartir y luego "Añadir a pantalla de inicio". Así se abre a pantalla completa, funciona sin conexión y tus datos quedan a salvo.</p></div></div>` : '');
// Revela las celdas al entrar en pantalla.
function revealOnScroll() {
  const els = document.querySelectorAll('.reveal:not(.in)');
  if (!els.length) return;
  if (!('IntersectionObserver' in window) || matchMedia('(prefers-reduced-motion: reduce)').matches) { els.forEach((e) => e.classList.add('in')); return; }
  document.documentElement.classList.add('io'); // solo se ocultan si el observador funciona
  const show = (e) => e.classList.add('in');
  const io = new IntersectionObserver((es) => es.forEach((x) => { if (x.isIntersecting) { show(x.target); io.unobserve(x.target); } }), { threshold: 0.15 });
  els.forEach((e) => io.observe(e));
  setTimeout(() => els.forEach(show), 3000); // red de seguridad: nunca quedan ocultas
}

function profileForm(p, label) {
  return `<div class="field" style="margin-top:0"><span class="lbl">Objetivo</span><div class="goal">${Object.entries(E.GOALS).map(([k, g]) =>
    `<label><input type="radio" name="goal" value="${k}" ${k === (p.goal || 'hipertrofia') ? 'checked' : ''}><div><b>${g.name}</b><small>${GOAL_TXT[k]}</small></div></label>`).join('')}</div></div>
  <div class="field"><span class="lbl">Días por semana</span>${segs('days', [1, 2, 3, 4, 5, 6].map((d) => [d, d]), p.days || 3)}</div>
  <div class="field"><span class="lbl">Minutos por sesión</span>${segs('min', [30, 45, 60, 75, 90, 120].map((m) => [m, m]), p.minutes || 60)}</div>
  <div class="field"><span class="lbl">Experiencia</span>${segs('level', [['principiante', 'Novato'], ['intermedio', 'Intermedio'], ['avanzado', 'Avanzado']], p.level || 'principiante')}<p class="mute" style="margin:8px 0 0">Novato: menos de 1 año entrenando con pesas. Intermedio: 1 a 3 años. Avanzado: más de 3.</p></div>
  <div class="field"><span class="lbl">Sexo</span>${segs('sex', [['m', 'Hombre'], ['f', 'Mujer']], p.sex || 'm')}</div>
  <div class="field"><div style="display:flex;gap:12px;flex-wrap:wrap"><div><label class="lbl" for="f-age">Edad</label><input id="f-age" type="number" inputmode="numeric" min="14" max="90" value="${p.age || ''}" style="width:100px"></div>
    <div><label class="lbl" for="f-h">Altura (cm)</label><input id="f-h" type="number" inputmode="numeric" min="120" max="230" value="${p.height || ''}" style="width:110px"></div></div>
    <p class="mute" style="margin:8px 0 0">Opcional. Con edad y altura, Coach calcula tus calorías y macros.</p><p id="ah-err" role="alert" style="margin:6px 0 0;color:var(--live);font-size:12px;font-weight:700"></p></div>
  <div class="field"><label class="lbl" for="f-bw">Peso corporal (kg)</label><input id="f-bw" type="number" inputmode="decimal" min="30" max="250" value="${p.bw || 70}" style="width:120px" aria-describedby="bw-help bw-err">
  <p class="mute" id="bw-help" style="margin:8px 0 0">Con tu sexo, peso y experiencia calculamos los pesos de tu primera sesión. Después se ajustan a lo que anotes.</p>
  <p id="bw-err" role="alert" style="margin:6px 0 0;color:var(--live);font-size:12px;font-weight:700"></p></div>
  <button class="btn" onclick="saveProfile()">${label}</button>`;
}

function saveProfile() {
  const val = (n) => document.querySelector(`input[name="${n}"]:checked`).value;
  const bw = +$('f-bw').value;
  if (!(bw >= 30 && bw <= 250)) { $('bw-err').textContent = 'Escribe tu peso corporal en kg, entre 30 y 250.'; $('f-bw').focus(); return; }
  const age = +$('f-age').value || null, height = +$('f-h').value || null;
  if ((age && !(age >= 14 && age <= 90)) || (height && !(height >= 120 && height <= 230))) { $('ah-err').textContent = 'Revisa edad (14 a 90) y altura en cm (120 a 230), o déjalas vacías.'; return; }
  const old = S.profile, goal = val('goal');
  S.profile = { goal, days: +val('days'), minutes: +val('min'), level: val('level'), sex: val('sex'), bw, age, height,
    start: old && old.goal === goal ? old.start : today() }; // nuevo objetivo = nuevo mesociclo
  S.plan = E.buildPlan(S.profile); S.next = 0; S.lifts = S.lifts || {}; S.sessions = S.sessions || []; delete S.active;
  save(); go('hoy');
}

function perfil() {
  return `${header('Perfil')}${iosHint()}<p class="mute" style="margin:0 0 12px">Al guardar rehacemos tu rutina con estos datos y empiezas por el día 1. Tus pesos, historial y rachas se conservan. Los ejercicios que cambiaste a mano vuelven a los de la rutina.</p>
  <div class="card">${profileForm(S.profile, 'Guardar y rehacer rutina')}</div>
  ${sec('Tus datos')}<div class="card"><p class="mute" style="margin:0">Tus datos se guardan solo en este navegador. Si lo borras o cambias de móvil, los pierdes. Exporta una copia y guárdala donde quieras; para recuperarla, usa Importar copia.</p>
    <button class="btn" onclick="exportData()">Exportar copia (.json)</button>
    <label class="btn ghost">Importar copia<input type="file" accept="application/json,.json" hidden onchange="importData(this.files[0])"></label>
    <button class="btn danger" onclick="resetAll()">Borrar todos mis datos</button></div>`;
}

function exportData() {
  const name = `forja-${today()}.json`, json = JSON.stringify(S, null, 1);
  const file = typeof File === 'function' ? new File([json], name, { type: 'application/json' }) : null;
  // En iPhone (sobre todo instalada en la pantalla de inicio) la descarga directa no funciona: se usa Compartir > Guardar en Archivos.
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Copia de Forja' }).catch((e) => { if (e.name !== 'AbortError') downloadJSON(json, name); });
    return;
  }
  downloadJSON(json, name);
}
function downloadJSON(json, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); // revocar antes cancela la descarga en Safari
}
function importData(file) {
  if (!file) return;
  if (file.size > 2e6) return alert('Ese archivo es demasiado grande para ser una copia de Forja. Elige el .json que descargaste con Exportar copia.');
  file.text().then((t) => {
    const d = E.sanitizeState(JSON.parse(t), today());
    if (!confirm('¿Reemplazar tus datos por los de la copia? Perderás lo que tengas ahora en este navegador.')) return;
    S = d; save(); go('hoy');
  }).catch(() => alert('No pudimos leer ese archivo como una copia de Forja. Elige el archivo .json que descargaste con Exportar copia.'));
}
function resetAll() {
  if (!confirm('¿Borrar todos tus datos? Se eliminan tu perfil, pesos, historial y rachas de este navegador y no se pueden recuperar, salvo que tengas una copia exportada.')) return;
  try { localStorage.removeItem(KEY); } catch {}
  S = {}; stopTimer(); render();
}

/* ---------- Inicio / entrenar ---------- */
function hoy() {
  const p = S.profile, ses = curSession(), g = E.GOALS[p.goal], rd = todayReadiness();
  const st = E.streaks(sessionDates(), p.days, today());
  const t = E.dnum(today()), mon = t - ((t + 3) % 7), dates = new Set(sessionDates());
  const thisWeek = [...dates].filter((d) => { const n = E.dnum(d); return n >= mon && n <= mon + 6; }).length;
  const doneNames = new Set(S.sessions.filter((s) => E.dnum(s.date) >= mon).map((s) => s.day));
  if (!S.active || S.active.day !== S.next) S.active = { day: S.next, reps: {}, w: {} };
  const A = S.active; A.w = A.w || {};
  const nx = S.next % S.plan.length;
  return `${header()}
  <div class="stories">${S.plan.map((d, i) => `<button class="story ${i === nx ? 'next' : doneNames.has(d.name) ? 'done' : ''}" onclick="go('rutina')" aria-label="Día ${i + 1}: ${esc(d.name)} (${mixText(d)})"><span class="ring" style="--mix:${mixRing(d)}"><span>${esc(abbr(d.name))}</span></span><small>${esc(d.name)}</small></button>`).join('')}</div>
  <div class="week" style="margin-top:12px" aria-label="Esta semana">${DOW.map((l, k) => { const n = mon + k;
    return `<div class="day ${dates.has(iso(n)) ? 'on' : ''} ${n === t ? 'today' : ''}">${l}<b>${iso(n).slice(8).replace(/^0/, '')}</b><i></i></div>`; }).join('')}</div>
  ${sec('Próxima sesión', `<button onclick="go('rutina')">Ver rutina</button>`)}
  <div class="hero"><img src="assets/athlete.jpg" alt="Atleta haciendo sentadilla con barra" loading="lazy" width="1100" height="828">
    <span class="vs">Día ${nx + 1} de ${S.plan.length} · ${g.name}</span>
    <div class="glass"><div class="side"><b>${st.cur}</b>días de racha</div>
      <div class="mid"><small>${ses.deload ? 'Semana de descarga' : 'Semana ' + ses.week}</small><strong>${esc(ses.name)}</strong><span class="dur">${svg(I.clock)}~${ses.minutes} min</span></div>
      <div class="side"><b>${ses.exercises.length}</b>ejercicios</div></div></div>
  <div class="limecard"><div class="top"><span>Objetivo semanal</span><span class="pilldark">${thisWeek >= p.days ? '¡Cumplido!' : 'En curso'}</span></div>
    <div class="score"><div><div class="ball">${svg(I.flame)}</div><small class="cap">Racha ${st.cur}</small></div>
      <div class="val"><b>${thisWeek} : ${p.days}</b><small>sesiones hechas / objetivo</small></div>
      <div><div class="ball">${svg(I.progreso)}</div><small class="cap">Mejor ${st.best}</small></div></div></div>
  ${S.sessions.some((s) => s.date === today()) ? '<div class="alert ok"><b>Hoy ya entrenaste.</b> Racha a salvo: descansar también es progresar.</div>' : ''}
  ${!rd && !S.sessions.some((s) => s.date === today()) ? `<div class="card insight info" style="margin-top:12px"><span class="ik">${svg(I.coach)}</span><div><b>¿Cómo llegas hoy?</b><p class="mute">Haz el check-in de 20 segundos y ajusto la sesión a tu recuperación.</p><button class="btn ghost" style="margin-top:10px" onclick="go('coach')">Hacer check-in</button></div></div>` : ''}
  ${rd && rd.level !== 'alta' && !ses.deload ? `<div class="alert warn"><b>Preparación ${rd.level} (${rd.score}/100).</b> ${rd.msg} La sesión de abajo ya está ajustada.</div>` : ''}
  ${ses.deload ? '<div class="alert warn"><b>Semana de descarga.</b> Mitad de series y −10% de carga para recuperarte y volver más fuerte.</div>' : ''}
  ${sec(esc(ses.name), `<span class="mute">Anota las reps de cada serie</span>`)}
  ${ses.exercises.map((e, i) => exCard(e, i, A)).join('')}
  <button class="btn" onclick="finish()">Terminar sesión</button>`;
}

function plateViz(w) {
  const col = { 25: '#ff5a4e', 20: '#4d8bff', 15: '#ffd23a', 10: '#d4f564', 5: '#f4f6ee', 2.5: '#ff8a3d', 1.25: '#9aa092' };
  const ps = E.plates(w);
  if (!ps.length) return 'Solo la barra (20 kg).';
  return `<div class="plates"><span class="bar"></span>${ps.map((p) => `<span class="plate" style="background:${col[p]};width:${p >= 10 ? 18 : 12}px;height:${12 + p * 1.4}px" title="${p} kg">${p >= 10 ? p : ''}</span>`).join('')}
    <span style="margin-left:8px;color:var(--mute)">por lado: ${ps.join(' + ')} kg</span></div>`;
}

function exCard(e, i, A) {
  const w = A.w[i] ?? e.w, reps = A.reps[i] || [], wu = E.warmup(e.id, w), alts = E.alternatives(e.id);
  const unit = e.eq === 'db' ? 'kg/mano' : e.eq === 'bw' ? 'kg extra' : 'kg';
  const done = reps.filter((v) => v !== '' && v != null).length;
  return `<div class="card mcard"><h3>${E.EX[e.id][0]}<small>${done >= e.sets ? '<span class="donetag">Completado</span>' : done ? `<span class="livedot">Serie ${done + 1}/${e.sets}</span>` : mtag(e.id)}</small></h3>
    <div class="row"><div><div class="team">Peso</div><div class="wbox"><input type="number" inputmode="decimal" step="0.5" min="0" value="${w}" aria-label="Peso de ${E.EX[e.id][0]} en ${unit}" style="width:${String(w).length + 0.3}ch" oninput="this.style.width=(this.value.length+.3)+'ch'" onchange="setW(${i},this.value)"><small class="mute">${unit}</small></div></div>
      <div class="center"><b>${e.sets} series</b>descanso ${fmt(e.rest)}</div>
      <div class="right"><div class="team">Reps</div><div class="big">${e.lo}-${e.hi}</div></div></div>
    <div class="sets">${Array.from({ length: e.sets }, (_, j) => { const v = reps[j] ?? '';
      return `<div class="set"><input type="number" inputmode="numeric" min="0" max="100" placeholder="-" value="${v}" class="${cls(v, e)}" aria-label="Reps serie ${j + 1}, objetivo ${e.lo} a ${e.hi}" onchange="setRep(this,${i},${j},${e.rest},${e.lo})"><span>${j + 1}</span></div>`; }).join('')}</div>
    <div class="effort"><span class="lbl" id="rir-l${i}">Reps que te sobraban en la última serie</span>${segs('rir' + i, [[0, '0'], [1, '1'], [2, '2'], [3, '3'], [4, '4+']], (A.rir || {})[i], 'sm').replace('<div class="seg sm">', `<div class="seg sm" role="radiogroup" aria-labelledby="rir-l${i}" onchange="setRir(${i},event.target.value)">`)}
      <label class="pain"><input type="checkbox" ${(A.pain || {})[i] ? 'checked' : ''} onchange="setPain(${i},this.checked)">Sentí molestia o dolor en este ejercicio</label></div>
    <details><summary>Técnica, calentamiento y alternativas<span class="mini">${svg(I.arrow)}</span></summary><div class="tools">
      ${C.CUES[e.id] ? `<div><b>Técnica:</b><ul class="cues">${C.CUES[e.id][0].map((c) => `<li>${c}</li>`).join('')}</ul><b>Error común:</b> ${C.CUES[e.id][1]}.</div>` : ''}
      ${wu.length ? `<div><b>Aproximación:</b> ${wu.map(([k, r]) => `${k} kg × ${r}`).join(' · ')}</div>` : ''}
      ${e.eq === 'bb' ? plateViz(w) : ''}
      ${alts.length ? `<div><b>¿Máquina ocupada o molestia?</b><br><select onchange="swap(${i},this.value)" aria-label="Cambiar ejercicio" style="margin-top:6px;width:100%"><option value="">Cambiar por…</option>${alts.map((k) => `<option value="${k}">${E.EX[k][0]}</option>`).join('')}</select></div>` : ''}
    </div></details></div>`;
}
const cls = (v, e) => (v === '' ? '' : v < e.lo ? 'low' : 'done');

function setRep(el, i, j, rest, lo) {
  const v = el.value === '' ? '' : Math.max(0, Math.min(100, Math.round(+el.value)));
  (S.active.reps[i] = S.active.reps[i] || [])[j] = v;
  el.value = v; el.className = cls(v, { lo });
  save();
  if (v !== '') startTimer(rest);
}
function setRir(i, v) { (S.active.rir = S.active.rir || {})[i] = +v; save(); }
function setPain(i, on) { (S.active.pain = S.active.pain || {})[i] = on; save(); }
function setW(i, v) { S.active.w[i] = Math.max(0, Math.min(500, +v || 0)); save(); render(); }
function swap(i, id) {
  if (!id) return;
  S.plan[S.next % S.plan.length].exercises[i].id = id;
  delete S.active.reps[i]; delete S.active.w[i];
  save(); render();
}

function finish() {
  const ses = curSession(), A = S.active;
  const missing = ses.exercises.filter((e, i) => !(A.reps[i] || []).some((v) => v !== '' && v != null)).length;
  if (missing === ses.exercises.length) return alert('Anota las reps de al menos una serie para terminar la sesión.');
  if (missing && !confirm(missing === 1 ? '1 ejercicio no tiene series anotadas y no contará para tu progreso. ¿Terminar la sesión igual?' : `${missing} ejercicios no tienen series anotadas y no contarán para tu progreso. ¿Terminar la sesión igual?`)) return;
  ses.exercises.forEach((e, i) => { if (A.w[i] != null) e.w = A.w[i]; e.sets = Math.max(e.sets, (A.reps[i] || []).length); });
  const vol = ses.exercises.reduce((s, e, i) => s + (A.reps[i] || []).reduce((a, r) => a + (+r || 0), 0) * e.w, 0);
  const res = E.applySession(S, ses, A.reps, today(), { rir: A.rir, pain: A.pain });
  delete S.active; save(); stopTimer();
  const st = E.streaks(sessionDates(), S.profile.days, today()), prs = res.filter((r) => r.pr).length;
  const icon = { up: '▲', hold: '=', down: '▼' };
  $('app').innerHTML = `<div class="fade">${header('Sesión completada')}
    <div class="limecard" style="margin-top:0"><div class="top"><span>${esc(ses.name)}</span><span class="pilldark">Guardada</span></div>
      <div class="score"><div><div class="ball">${svg(I.flame)}</div><small class="cap">Racha ${st.cur}</small></div>
        <div class="val"><b>${Math.round(vol).toLocaleString('es')}</b><small>kg de volumen total</small></div>
        <div><div class="ball">${svg(I.progreso)}</div><small class="cap">${prs === 1 ? "1 récord" : prs + " récords"}</small></div></div></div>
    ${sec('Ajustes para la próxima')}
    <div class="card">${res.map((r) => `<div class="res ${r.kind}"><span class="ic">${icon[r.kind]}</span><div><div style="font-weight:700">${r.name}${r.pr ? `<span class="prb">Nuevo récord</span>` : ''}</div><div class="mute">${r.msg}</div></div></div>`).join('')}</div>
    <button class="btn" onclick="render()">Listo</button></div>`;
  scrollTo(0, 0);
}

/* ---------- Coach ---------- */
function checkinForm() {
  const scale = [1, 2, 3, 4, 5].map((n) => [n, n]);
  return `<div class="field" style="margin-top:0"><span class="lbl">Horas de sueño anoche</span>${segs('ck-sleep', [[5, '5 o menos'], [6, '6'], [7, '7'], [8, '8'], [9, '9+']], 7)}</div>
    <div class="field"><span class="lbl">Energía</span>${segs('ck-energy', scale, 3)}<p class="mute" style="margin:6px 0 0">1 = sin energía · 5 = a tope</p></div>
    <div class="field"><span class="lbl">Agujetas o cansancio muscular</span>${segs('ck-sore', scale, 2)}<p class="mute" style="margin:6px 0 0">1 = nada · 5 = mucho</p></div>
    <div class="field"><span class="lbl">Estrés</span>${segs('ck-stress', scale, 2)}<p class="mute" style="margin:6px 0 0">1 = nada · 5 = mucho</p></div>
    <button class="btn" onclick="saveCheckin()">Guardar check-in</button>`;
}
function saveCheckin() {
  const v = (n) => +document.querySelector(`input[name="${n}"]:checked`).value;
  (S.checkins = S.checkins || {})[today()] = { sleep: v('ck-sleep'), energy: v('ck-energy'), soreness: v('ck-sore'), stress: v('ck-stress') };
  save(); render();
}
function redoCheckin() { delete S.checkins[today()]; save(); render(); }
function logBW() {
  const kg = Math.round(+$('bw-in').value * 10) / 10;
  if (!(kg >= 30 && kg <= 250)) { $('bw-msg').textContent = 'Escribe tu peso en kg, entre 30 y 250.'; return; }
  S.bwlog = (S.bwlog || []).filter((x) => x.d !== today()).concat({ d: today(), kg }).sort((a, b) => (a.d < b.d ? -1 : 1)).slice(-120);
  S.profile.bw = kg; save(); render();
}
function nutritionCard(n, p) {
  const [lo, hi] = n.rate, f = (x) => (x > 0 ? '+' : '') + String(x).replace('.', ',');
  return `<div style="display:flex;justify-content:space-between;align-items:baseline"><div><div class="team">Calorías al día</div><div class="big">${n.kcal.toLocaleString('es')}<small>kcal</small></div></div><div class="right"><div class="team">Agua</div><div class="big">${String(n.water).replace('.', ',')}<small>L</small></div></div></div>
    <div class="macros"><div><b>${n.protein} g</b><small>proteína</small></div><div><b>${n.carbs} g</b><small>carbohidratos</small></div><div><b>${n.fat} g</b><small>grasa</small></div></div>
    <p class="mute" style="margin:12px 0 0">Gasto estimado: ${n.tdee.toLocaleString('es')} kcal/día (fórmula de Mifflin-St Jeor y tus días de entrenamiento). Proteína: ${String(n.protKg).replace('.', ',')} g por kg de peso. Ritmo de peso recomendado: entre ${f(lo)} % y ${f(hi)} % por semana; si te sales, Coach te dirá cuánto ajustar.</p>`;
}
function coach() {
  const p = S.profile, td = today(), ck = (S.checkins || {})[td], rd = ck && C.readiness(ck);
  const ins = C.insights(S, td), n = C.nutrition(p), tr = C.bwTrend(S.bwlog || [], td), bw = S.bwlog || [];
  const ic = { ok: I.check, warn: I.alert, info: I.info };
  const bwData = { labels: bw.slice(-30).map((x) => x.d.slice(8) + '/' + x.d.slice(5, 7)), data: bw.slice(-30).map((x) => x.kg), unit: 'kg' };
  return `${header('Coach')}
  ${sec('Check-in de hoy', ck ? '<button onclick="redoCheckin()">Rehacer</button>' : '<span class="mute">20 segundos</span>')}
  <div class="card">${ck ? `<div class="readiness"><div class="rscore ${rd.level}"><b>${rd.score}</b><small>de 100</small></div><div><b>Preparación ${rd.level}</b><p class="mute" style="margin:3px 0 0">${rd.msg}</p></div></div>` : checkinForm()}</div>
  ${sec('Lo que veo en tus datos')}
  ${ins.length ? ins.map((x) => `<div class="card insight ${x.kind}"><span class="ik">${svg(ic[x.kind])}</span><div><b>${x.title}</b><p class="mute">${x.text}</p></div></div>`).join('')
    : '<div class="card"><p class="mute" style="margin:0">Todavía no hay datos suficientes. Entrena un par de semanas, haz el check-in y registra tu peso: aquí aparecerán consejos sobre constancia, estancamientos, sueño y peso.</p></div>'}
  ${sec('Nutrición', `<span class="mute">${E.GOALS[p.goal].name}</span>`)}
  <div class="card mcard">${n ? nutritionCard(n, p) : `<p class="mute" style="margin:0">Añade tu edad y altura en Perfil para calcular tus calorías y macros.</p><button class="btn ghost" onclick="go('perfil')">Ir a Perfil</button>`}</div>
  ${sec('Peso corporal', tr ? `<span class="mute">media de 7 días: ${String(tr.avg).replace('.', ',')} kg</span>` : '')}
  <div class="card"><label class="lbl" for="bw-in">Peso de hoy (kg)</label><div style="display:flex;gap:8px;align-items:center"><input id="bw-in" type="number" inputmode="decimal" step="0.1" min="30" max="250" value="${p.bw}" style="width:110px"><button class="btn" style="margin:0;width:auto;padding:12px 20px" onclick="logBW()">Registrar</button></div>
    <p id="bw-msg" role="alert" style="margin:6px 0 0;color:var(--live);font-size:12px;font-weight:700"></p>
    ${bw.length >= 2 ? `<div class="chart"><canvas data-chart='${JSON.stringify(bwData)}' role="img" aria-label="Evolución de tu peso corporal"></canvas></div>` : '<p class="mute" style="margin:0">Pésate 3 o 4 veces por semana, en ayunas y tras ir al baño. Lo que cuenta es la media semanal, no el dato de un día.</p>'}</div>
  ${sec('Aprende', '<span class="mute">basado en evidencia</span>')}
  <div class="card">${C.ARTICLES.map((a) => `<details class="art"><summary>${a.t}<span class="mini">${svg(I.arrow)}</span></summary><div class="tools"><p style="margin:0">${a.b}</p><p class="mute" style="margin:0">Fuente: ${a.ref}</p></div></details>`).join('')}</div>
  <p class="mute">Forja te orienta con evidencia científica, pero no sustituye a un médico, nutricionista o fisioterapeuta. Ante una lesión, enfermedad o dolor que no se va, consulta a un profesional.</p>`;
}

/* ---------- Rutina ---------- */
function rutina() {
  const p = S.profile, g = E.GOALS[p.goal], ws = E.weeklySets(S.plan), max = Math.max(20, ...Object.values(ws)), nx = S.next % S.plan.length;
  return `${header('Mi rutina')}
  <div class="chips"><span class="chip plain">${g.name}</span><span class="chip plain">${p.days} días</span><span class="chip plain">${p.minutes} min</span><span class="chip plain">${{ principiante: 'Novato', intermedio: 'Intermedio', avanzado: 'Avanzado' }[p.level]}</span></div>
  ${S.plan.map((d, i) => `${sec(`Día ${i + 1} · ${esc(d.name)}`, `<span class="${i === nx ? 'livedot' : 'mute'}">${i === nx ? 'Siguiente' : '~' + d.minutes + ' min'}</span>`)}
    <div class="card"><table>${d.exercises.map((e) => `<tr><td><span class="dot" style="${gv(grp(e.id))}">${E.EX[e.id][0]}</span></td><td class="r">${e.sets}×${e.lo}-${e.hi}</td><td class="r m">${fmt(e.rest)}</td></tr>`).join('')}</table></div>`).join('')}
  ${sec('Volumen por músculo', '<span class="mute">series/semana</span>')}
  <div class="card"><p class="mute" style="margin:0 0 6px">Para ganar músculo, la evidencia apunta a 10-20 series por músculo a la semana.</p>
    ${legend()}<table>${Object.entries(ws).sort((a, b) => b[1] - a[1]).map(([m, n]) => { const low = n < 10 && p.goal === 'hipertrofia';
      return `<tr><td><span class="dot" style="${gv(muscleGroup(m))}">${m}</span></td><td style="width:42%"><div class="vol"><i style="width:${(n / max) * 100}%;background:var(--${muscleGroup(m)})"></i></div></td><td class="r">${low ? `<span class="lowv" title="Menos de 10 series">${n} · bajo</span>` : n}</td></tr>`; }).join('')}</table></div>
  ${sec(`Claves: ${g.name}`)}<div class="card"><ul>${E.GUIDE[p.goal].map((t) => `<li>${t}</li>`).join('')}</ul></div>
  ${sec('Cómo decide Forja')}<div class="card"><ul>${E.PRINCIPLES.map((t) => `<li>${t}</li>`).join('')}</ul></div>`;
}

/* ---------- Progreso ---------- */
function progreso() {
  const p = S.profile, st = E.streaks(sessionDates(), p.days, today());
  const rows = Object.entries(S.lifts).filter(([, l]) => l.log && l.log.length).sort((a, b) => b[1].log.length - a[1].log.length);
  const t = E.dnum(today()), mon = t - ((t + 3) % 7), dates = new Set(sessionDates());
  const cells = Array.from({ length: 84 }, (_, i) => { const n = mon - 77 + i;
    return `<i class="${dates.has(iso(n)) ? 'on' : ''} ${n === t ? 'today' : ''} ${n > t ? 'fut' : ''}" title="${iso(n)}"></i>`; }).join('');
  const top = `${header('Progreso')}<div class="stats"><div class="stat"><b>${S.sessions.length}</b><small>sesiones</small></div><div class="stat"><b>${st.weeks}</b><small>semanas cumplidas</small></div><div class="stat"><b>${st.best}</b><small>mejor racha</small></div></div>
    ${sec('Mapa de racha', '<span class="mute">12 semanas</span>')}<div class="card"><div class="heat" aria-label="Constancia últimas 12 semanas">${cells}</div>
    <p class="mute" style="margin:10px 0 0">La racha sigue si no pasas más de ${st.gap} días sin entrenar.</p></div>`;
  if (!rows.length) return top + `<div class="card"><p class="mute" style="margin:0">Aquí verás tus pesos, récords y la evolución de cada ejercicio cuando termines tu primera sesión.</p><button class="btn" onclick="go('hoy')">Ir a entrenar</button></div>`;
  if (!perfId || !S.lifts[perfId]) perfId = rows[0][0];
  const L = S.lifts[perfId].log;
  const data = { labels: L.map((x) => x.d.slice(8) + '/' + x.d.slice(5, 7)), data: L.map((x) => Math.round(x.w * (1 + Math.max(...x.r) / 30))) };
  return `${top}${sec('Rendimiento', '<span class="mute">máximo estimado</span>')}
  <div class="chips">${rows.map(([k]) => `<button class="chip ${k === perfId ? 'on' : ''}" style="${gv(grp(k))}" onclick="perfId='${k}';render()"><i>${esc(abbr(E.EX[k][0]))}</i>${E.EX[k][0]}</button>`).join('')}</div>
  <div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>${E.EX[perfId][0]}</b><span class="mute">próxima sesión: <b style="color:var(--lime)">${S.lifts[perfId].w} kg</b></span></div>
    <div class="chart"><canvas data-chart='${JSON.stringify(data)}' role="img" aria-label="Evolución del peso máximo estimado en ${E.EX[perfId][0]}"></canvas></div></div>
  ${sec('Registro de cargas')}
  ${rows.map(([id, l]) => { const x = l.log[l.log.length - 1];
    return `<div class="card mcard"><h3>${E.EX[id][0]}<small>${mtag(id)}</small></h3><div class="row"><div><div class="team">Próxima</div><div class="big">${l.w}<small>kg</small></div></div>
      <div class="center">Última, ${x.d.slice(8)}/${x.d.slice(5, 7)}<b>${x.w} kg × ${x.r.join(' / ')}</b></div>
      <div class="right"><div class="team">Máximo est.</div><div class="big">${l.e1rm ? Math.round(l.e1rm) : '-'}<small>kg</small></div></div></div></div>`; }).join('')}
  <p class="mute">Máximo estimado: el peso que podrías levantar una sola vez (1RM), calculado con la fórmula de Epley a partir de tu mejor serie de cada sesión.</p>`;
}

/* ---------- Temporizador de descanso ---------- */
function startTimer(sec) { tEnd = Date.now() + sec * 1000; tTotal = sec; $('timer').style.display = 'flex'; clearInterval(tInt); tick(); tInt = setInterval(tick, 500); }
function addTime(s) { tEnd += s * 1000; tTotal += s; tick(); }
function tick() {
  const l = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  $('tleft').textContent = fmt(l); $('tbar').style.width = (l / tTotal) * 100 + '%';
  if (!l) { stopTimer(); navigator.vibrate && navigator.vibrate([200, 100, 200]); }
}
function stopTimer() { clearInterval(tInt); $('timer').style.display = 'none'; }

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
render();
</script>
</body>
</html>
